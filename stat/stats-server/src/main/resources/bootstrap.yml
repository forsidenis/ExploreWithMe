spring:
  application:
    name: stats-server
  cloud:
    config:
      uri: http://config-server:8888
      discovery:
        enabled: false
      fail-fast: true
      retry:
        max-attempts: 3
        initial-interval: 5000
        multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true