server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.h2.Driver
    username: stat
    password:
    url: jdbc:h2:mem:ewm_main
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false

stats:
  client:
    enabled: false

logging:
  level:
    ru.practicum.main.service: DEBUG