server:
  port: 0

spring:
  application:
    name: main-service
  config:
    activate:
      on-profile: docker
    datasource:
      url: jdbc:postgresql://ewm-main-db:5432/ewm-main
      username: main
      password: main
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: none

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    ru.practicum: DEBUG