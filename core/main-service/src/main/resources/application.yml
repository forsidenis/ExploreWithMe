server:
  port: 0

spring:
  application:
    name: main-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: CONFIG-SERVER
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 5000
        multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka
  instance:
    prefer-ip-address: true