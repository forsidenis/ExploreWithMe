spring:
  application:
    name: gateway-server
  cloud:
    config:
      uri: http://config-server:8888
      discovery:
        enabled: false
      fail-fast: true
      retry:
        max-attempts: 5
        initial-interval: 2000
        multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka