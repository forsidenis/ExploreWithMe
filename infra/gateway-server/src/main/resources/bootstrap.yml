spring:
  application:
    name: gateway-server
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        max-attempts: 5
        initial-interval: 2000
        multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka