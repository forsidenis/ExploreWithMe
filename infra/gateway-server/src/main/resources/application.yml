server:
  port: 8080

spring:
  application:
    name: gateway-server
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: CONFIG-SERVER
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 5000
        multiplier: 1.5
  gateway:
    discovery:
      locator:
        enabled: false
    routes:
      - id: main-service
        uri: http://ewm-service:8080
        predicates:
          - Path=/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka
  instance:
    prefer-ip-address: true